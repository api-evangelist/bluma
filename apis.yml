name: Bluma
description: >-
  Bluma is a San Francisco-based AI company (Y Combinator Fall 2025) building a short-form AI content
  engine that lets creators, agencies, and brands produce social media video ads at scale. The platform
  "de-edits" existing reference videos into their individual scenes, captions, and overlays, then uses
  AI asset generation and a node-based canvas editor to recreate and remix shots into new ads, UGC, and
  template-based videos optimized for TikTok, Reels, and Shorts. Bluma ships a public developer program:
  a REST API at api.getbluma.com/api/v1 for asynchronous video generation, templates, credits, API keys,
  webhooks and usage analytics; Mintlify-hosted documentation at docs.getbluma.com; first-party
  TypeScript and Python SDKs; a seven-event HMAC-signed webhook surface; published per-tier rate limits;
  and an undocumented but live hosted MCP server at api.getbluma.com/api/mcp gated by Clerk OAuth 2.1
  with dynamic client registration. Founded by Alisa Wu (formerly Zoox/Amazon) and Stephen Ni.
