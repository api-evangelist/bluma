apis:
- name: Bluma API
  description: >-
    Asynchronous short-form video generation REST API. Submit a template id and a prompt
    to POST /v1/videos, receive a job id, and collect the finished render either by
    polling GET /v1/videos/{id} or by subscribing to the video.completed webhook, then
    fetch a one-hour signed URL from GET /v1/videos/{id}/download. Also covers template
    discovery, credit balance and history, API key lifecycle (create, list, rotate with a
    30-day grace, revoke), webhook registration and delivery logs, and usage metrics.
    Authenticated with prefixed bearer API keys (bluma_test_ / bluma_live_) carrying eight
    product scopes.
  humanURL: https://docs.getbluma.com/api-reference/overview
  baseURL: https://api.getbluma.com/api/v1
