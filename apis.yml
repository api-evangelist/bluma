name: Bluma
description: >-
  Bluma is a San Francisco-based AI company (Y Combinator Fall 2025) building a short-form AI content
  engine that lets creators, agencies, and brands produce social media video ads at scale. The platform
  "de-edits" existing reference videos into their individual scenes, captions, and overlays, then uses
  AI asset generation and a node-based canvas editor to recreate and remix shots into new ads, UGC, and
  template-based videos optimized for TikTok, Reels, and Shorts. Bluma also publishes a set of free,
  browser-based social tools (video downloading, carousel/slideshow extraction, TikTok/Instagram URL
  normalization, metadata inspection, transcript generation, audio extraction, thumbnail capture).
  Founded by Alisa Wu (formerly Zoox/Amazon) and Stephen Ni. No public developer API, OpenAPI, SDK, or
  developer portal has been published to date; this profile captures the company identity and the
  security posture of its public web surface.
