    note: >-
      Bluma's API Reference Overview advertises a complete OpenAPI at this URL and tells
      readers to import it into Postman, Insomnia or Swagger UI. It returns 401 "No
      authorization token provided" to an anonymous request, so the spec could not be
      retrieved and none has been saved. Publishing it unauthenticated is the single
      highest-value fix available to this provider.
- name: Bluma MCP Server
  description: >-
    Hosted Model Context Protocol server on the Bluma API host. Discovered via RFC 9728
    OAuth Protected Resource Metadata rather than from the documentation, which never
    mentions it. Requires an OAuth 2.1 bearer token issued by clerk.getbluma.com;
    dynamic client registration and PKCE S256 are supported, so a compliant MCP client
    can bootstrap itself. An anonymous tools/list returns 401 with a spec-correct
    WWW-Authenticate resource_metadata challenge, so the live tool surface is not
    publicly readable.
  humanURL: https://api.getbluma.com/.well-known/oauth-protected-resource
  baseURL: https://api.getbluma.com/api/mcp
  tags:
  - MCP
  - AI
  - Agents
