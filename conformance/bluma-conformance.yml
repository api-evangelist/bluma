standards:
- id: oauth2
  name: OAuth 2.0 / 2.1 authorization code with PKCE
  conforms: true
  evidence: >-
    clerk.getbluma.com advertises authorization_code + refresh_token grants,
    code_challenge_methods_supported [S256], and client_secret_basic/post/none token
    endpoint auth. Verified at
    https://clerk.getbluma.com/.well-known/oauth-authorization-server (HTTP 200).
  scope: MCP server only; the REST API uses static API keys.
- id: rfc8414
  name: OAuth 2.0 Authorization Server Metadata
  conforms: true
  evidence: >-
    https://clerk.getbluma.com/.well-known/oauth-authorization-server returns HTTP 200
    with issuer, authorization_endpoint, token_endpoint, jwks_uri, registration_endpoint
    and scopes_supported.
- id: rfc9728
  name: OAuth 2.0 Protected Resource Metadata
  conforms: true
  evidence: >-
    https://api.getbluma.com/.well-known/oauth-protected-resource returns HTTP 200 with
    resource, authorization_servers, bearer_methods_supported and scopes_supported; the
    gated MCP endpoint returns 401 with
    WWW-Authenticate: Bearer resource_metadata="<that URL>".
- id: rfc7591
  name: OAuth 2.0 Dynamic Client Registration
  conforms: true
  evidence: >-
    registration_endpoint https://clerk.getbluma.com/oauth/register is advertised in the
    authorization server metadata.
- id: oidc
  name: OpenID Connect Discovery 1.0
  conforms: true
  evidence: >-
    https://clerk.getbluma.com/.well-known/openid-configuration returns HTTP 200 with
    id_token_signing_alg_values_supported [RS256], subject_types_supported [public] and a
    jwks_uri that resolves (HTTP 200).
- id: mcp
  name: Model Context Protocol
  conforms: partial
  evidence: >-
    A hosted MCP server responds at https://api.getbluma.com/api/mcp and implements the
    MCP authorization spec correctly (RFC 9728 metadata + spec-shaped 401 challenge).
    Protocol version and tool surface could not be verified because tools/list is
    auth-gated (HTTP 401).
- id: rfc9457
  name: RFC 9457 / RFC 7807 Problem Details for HTTP APIs
  conforms: false
  claimed: true
  evidence: >-
    The docs state errors "follow RFC 7807", but the envelope nests type/title/status/
    detail under an "error" key and is served as application/json, not
    application/problem+json. A live anonymous call to
    https://api.getbluma.com/api/v1/templates returned application/json with
    {"error":"No authorization token provided"} — a bare string, not even Bluma's own
    documented object. See errors/bluma-problem-types.yml.
- id: openapi
  name: OpenAPI Specification
  conforms: unknown
  evidence: >-
    Bluma advertises a spec at https://api.getbluma.com/api/v1/openapi.json on its API
    Reference Overview page and instructs users to import it into Postman/Insomnia/
    Swagger UI, but the URL returns HTTP 401 to an anonymous request. The document could
    not be retrieved, so neither its existence nor its version can be confirmed.
- id: asyncapi
  name: AsyncAPI
  conforms: false
  evidence: >-
